name: DETE CD — Continuous Deployment to Oracle Cloud

on:
  push:
    branches: [ master, main ]
    paths:
      - 'services/**'
      - 'libs/**'
      - 'frontend/**'
      - 'infra/**'
      - 'scripts/**'
      - 'benchmarks/**'
      - 'build.gradle.kts'
      - '.github/workflows/cd.yml'
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to K3s Cluster (Oracle VPS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure SSH Key
        env:
          SSH_KEY: ${{ secrets.ORACLE_VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.ORACLE_VPS_HOST }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::ORACLE_VPS_SSH_KEY secret is EMPTY or NOT FOUND in GitHub Secrets! Please check repository settings."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          sed -i -e '$a\' ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "Validating SSH key format:"
          ssh-keygen -l -f ~/.ssh/id_rsa
          TARGET_HOST="${VPS_HOST:-141.148.223.82}"
          ssh-keyscan -H "$TARGET_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on Oracle Cloud VPS via SSH
        env:
          VPS_HOST: ${{ secrets.ORACLE_VPS_HOST }}
          VPS_USER: ${{ secrets.ORACLE_VPS_USER }}
        run: |
          TARGET_HOST="${VPS_HOST:-141.148.223.82}"
          TARGET_USER="${VPS_USER:-ubuntu}"
          ssh -v -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$TARGET_USER@$TARGET_HOST" bash -s << 'EOF'
            set -e
            echo "=========================================================="
            echo " Starting DETE Automated Deployment on K3s Cluster"
            echo " Commit: ${{ github.sha }}"
            echo "=========================================================="

            cd /home/ubuntu/dete
            git fetch origin master
            git reset --hard origin/master

            echo "--> Compiling Spring Boot Executable JARs..."
            ./gradlew bootJar -x test --no-daemon --max-workers=2

            echo "--> Packaging Container Images..."
            chmod +x ./scripts/*.sh
            ./scripts/package_images.sh

            echo "--> Importing Images to K3s containerd..."
            ./scripts/import_images_to_k3s.sh

            echo "--> Upgrading Helm Release 'dete'..."
            helm upgrade --install dete ./infra/helm/dete -n dete

            echo "--> Rolling out Deployment Updates..."
            kubectl rollout restart deployment account audit auth gateway market-data matching-engine order risk simulator frontend -n dete

            echo "--> Verifying Rollout Status..."
            kubectl rollout status deployment/gateway -n dete --timeout=180s
            kubectl rollout status deployment/order -n dete --timeout=180s
            kubectl rollout status deployment/frontend -n dete --timeout=180s
            kubectl rollout status deployment/account -n dete --timeout=180s

            echo "All microservices successfully deployed and running."
          EOF

  smoke-test:
    name: Automated Smoke & Integration Verification
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure SSH Key
        env:
          SSH_KEY: ${{ secrets.ORACLE_VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.ORACLE_VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          sed -i -e '$a\' ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -l -f ~/.ssh/id_rsa
          TARGET_HOST="${VPS_HOST:-141.148.223.82}"
          ssh-keyscan -H "$TARGET_HOST" >> ~/.ssh/known_hosts

      - name: Execute Live Smoke Tests on Oracle VPS
        env:
          VPS_HOST: ${{ secrets.ORACLE_VPS_HOST }}
          VPS_USER: ${{ secrets.ORACLE_VPS_USER }}
        run: |
          TARGET_HOST="${VPS_HOST:-141.148.223.82}"
          TARGET_USER="${VPS_USER:-ubuntu}"
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$TARGET_USER@$TARGET_HOST" bash -s << 'EOF'
            set -e
            echo "--> Running DETE Smoke Tests..."
            python3 /home/ubuntu/dete/scripts/smoke_test.py
          EOF

      - name: Post Deployment Summary
        if: always()
        env:
          VPS_HOST: ${{ secrets.ORACLE_VPS_HOST }}
        run: |
          TARGET_HOST="${VPS_HOST:-141.148.223.82}"
          echo "### 🚀 DETE Deployment Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Host**: \`$TARGET_HOST\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trading Web UI**: http://$TARGET_HOST/" >> $GITHUB_STEP_SUMMARY
          echo "- **Grafana Telemetry**: http://$TARGET_HOST/grafana/" >> $GITHUB_STEP_SUMMARY

