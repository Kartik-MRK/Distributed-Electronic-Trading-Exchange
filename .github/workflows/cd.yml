name: DETE CD — Continuous Deployment to Oracle Cloud

on:
  workflow_run:
    workflows: ["DETE CI — Continuous Integration"]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    name: Deploy to K3s Cluster (Oracle VPS)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Require successful CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/workflows/ci.yml/runs?head_sha={os.environ['DEPLOY_SHA']}&per_page=100"
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"}
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
              runs = json.load(response)["workflow_runs"]
          runs = [run for run in runs if run["head_sha"] == os.environ["DEPLOY_SHA"]]
          latest = max(runs, key=lambda run: (run["run_number"], run["run_attempt"]), default=None)
          if not latest or latest["status"] != "completed" or latest["conclusion"] != "success":
              raise SystemExit("Deployment requires the latest CI run for this exact SHA to succeed")
          print("Verified successful CI:", latest["html_url"])
          PY

      - name: Configure SSH Key
        env:
          SSH_KEY: ${{ secrets.ORACLE_VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.ORACLE_VPS_HOST }}
        run: |
          python3 ./scripts/configure_ssh_key.py
          TARGET_HOST="${VPS_HOST:-141.148.223.82}"
          ssh-keyscan -H "$TARGET_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on Oracle Cloud VPS via SSH
        env:
          VPS_HOST: ${{ secrets.ORACLE_VPS_HOST }}
          VPS_USER: ${{ secrets.ORACLE_VPS_USER }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          TARGET_HOST="${VPS_HOST:-141.148.223.82}"
          TARGET_USER="${VPS_USER:-ubuntu}"
          SSH_OPTS="-o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20"
          echo "Connecting to $TARGET_USER@$TARGET_HOST..."
          if ! ssh -v -o BatchMode=yes $SSH_OPTS -i ~/.ssh/id_rsa "$TARGET_USER@$TARGET_HOST" "echo SSH_CONNECTION_OK" > /tmp/ssh_debug.log 2>&1; then
            cat /tmp/ssh_debug.log
            while IFS= read -r line; do
              echo "::error title=SSH Debug::$line"
            done < <(tail -n 15 /tmp/ssh_debug.log)
            exit 255
          fi
          echo "SSH connection established successfully!"
          ssh $SSH_OPTS -i ~/.ssh/id_rsa "$TARGET_USER@$TARGET_HOST" \
            bash -s -- "$DEPLOY_SHA" < scripts/deploy_vps.sh

  smoke-test:
    name: Automated Smoke & Integration Verification
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure SSH Key
        env:
          SSH_KEY: ${{ secrets.ORACLE_VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.ORACLE_VPS_HOST }}
        run: |
          python3 ./scripts/configure_ssh_key.py
          TARGET_HOST="${VPS_HOST:-141.148.223.82}"
          ssh-keyscan -H "$TARGET_HOST" >> ~/.ssh/known_hosts

      - name: Execute Live Smoke Tests on Oracle VPS
        env:
          VPS_HOST: ${{ secrets.ORACLE_VPS_HOST }}
          VPS_USER: ${{ secrets.ORACLE_VPS_USER }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          TARGET_HOST="${VPS_HOST:-141.148.223.82}"
          TARGET_USER="${VPS_USER:-ubuntu}"
          SSH_OPTS="-o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20"
          ssh $SSH_OPTS -i ~/.ssh/id_rsa "$TARGET_USER@$TARGET_HOST" \
            python3 "/home/$TARGET_USER/dete-releases/$DEPLOY_SHA/scripts/smoke_test.py"

      - name: Post Deployment Summary
        if: always()
        env:
          VPS_HOST: ${{ secrets.ORACLE_VPS_HOST }}
        run: |
          TARGET_HOST="${VPS_HOST:-141.148.223.82}"
          echo "### 🚀 DETE Deployment Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Host**: \`$TARGET_HOST\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.event.workflow_run.head_sha || github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trading Web UI**: https://dete.kartik-mrk.me/" >> $GITHUB_STEP_SUMMARY
          echo "- **Grafana Telemetry**: https://dete.kartik-mrk.me/grafana/" >> $GITHUB_STEP_SUMMARY

