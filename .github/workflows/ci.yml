name: DETE CI — Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Spotless Format Check
        run: ./gradlew spotlessCheck --no-daemon

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Dependency Install & Lint
        working-directory: ./frontend
        run: |
          npm ci
          npm test
          npm run type-check
          npm run lint
          npm run build

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.0'

      - name: Helm Chart Lint
        run: helm lint ./infra/helm/dete

      - name: Deployment script checks
        run: |
          bash -n scripts/deploy_vps.sh scripts/package_images.sh scripts/import_images_to_k3s.sh
          python3 -m py_compile scripts/deployment_preflight.py scripts/smoke_test.py
          python3 -m unittest discover -s scripts -p 'test_smoke_test.py'

  test-and-compile:
    name: Compile & Test Suite
    needs: format-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Compile Java Classes
        run: ./gradlew compileJava testClasses --no-daemon --max-workers=2

      - name: Enable Testcontainers Container Reuse
        run: echo "testcontainers.reuse.enable=true" > ~/.testcontainers.properties

      - name: Execute Unit & Architecture Tests
        run: ./gradlew test -PexcludeIntegration --no-daemon --max-workers=2

      - name: Publish Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-results
          path: '**/build/reports/tests/test/'
          retention-days: 7

  integration-tests:
    name: Docker Integration Tests
    needs: format-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: '**/build/reports/tests/test/'

  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'


