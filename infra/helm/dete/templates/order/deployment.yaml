apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  labels:
    {{- include "dete.labels" . | nindent 4 }}
    app: order
spec:
  replicas: {{ .Values.order.replicaCount }}
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      containers:
        - name: order
          image: {{ .Values.order.image }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: {{ .Values.order.port }}
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/dete?currentSchema=order_svc"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dete-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dete-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dete-secrets
                  key: REDIS_PASSWORD
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: RISK_GRPC_HOST
              value: "risk"
            - name: RISK_GRPC_PORT
              value: "9095"
            - name: ACCOUNT_SERVICE_URL
              value: "http://account:8082"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dete-secrets
                  key: JWT_SECRET
          resources:
            {{- toYaml .Values.order.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.order.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.order.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.order.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order
  labels:
    {{- include "dete.labels" . | nindent 4 }}
    app: order
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.order.port }}
      targetPort: {{ .Values.order.port }}
      name: http
  selector:
    app: order
