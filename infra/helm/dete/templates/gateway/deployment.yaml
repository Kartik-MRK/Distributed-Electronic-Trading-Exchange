apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    {{- include "dete.labels" . | nindent 4 }}
    app: gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: {{ .Values.gateway.image }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: {{ .Values.gateway.port }}
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: PORT
              value: {{ .Values.gateway.port | quote }}
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dete-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dete-secrets
                  key: JWT_SECRET
            - name: AUTH_SERVICE_URL
              value: "http://auth:8081"
            - name: ORDER_SERVICE_URL
              value: "http://order:8083"
            - name: ACCOUNT_SERVICE_URL
              value: "http://account:8082"
            - name: MARKET_DATA_SERVICE_URL
              value: "http://market-data:8087"
            - name: AUDIT_SERVICE_URL
              value: "http://audit:8086"
            - name: MARKET_DATA_WS_URL
              value: "ws://market-data:8087"
            - name: MATCHING_ENGINE_URL
              value: "http://matching-engine:8084"
            - name: RISK_SERVICE_URL
              value: "http://risk:8085"
            - name: SIMULATOR_URL
              value: "http://simulator:8089"
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.gateway.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.gateway.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.gateway.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "dete.labels" . | nindent 4 }}
    app: gateway
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.gateway.port }}
      targetPort: {{ .Values.gateway.port }}
      name: http
  selector:
    app: gateway
