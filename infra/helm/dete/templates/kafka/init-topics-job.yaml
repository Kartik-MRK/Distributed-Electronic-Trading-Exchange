apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init-topics
  labels:
    {{- include "dete.labels" . | nindent 4 }}
    app: kafka-init-topics
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    metadata:
      labels:
        app: kafka-init-topics
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-init
          image: {{ .Values.kafka.image }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "Waiting for Kafka to become available..."
              until kafka-broker-api-versions --bootstrap-server kafka:9092; do
                sleep 2
              done
              echo "Kafka is ready. Creating DETE topics..."

              TOPICS=(
                "order.commands:3"
                "order.events:3"
                "trade.executions:3"
                "market-data:3"
                "ledger.events:3"
                "audit.events:3"
                "simulator.commands:1"
                "order.commands.DLQ:1"
                "order.events.DLQ:1"
                "trade.executions.DLQ:1"
                "ledger.events.DLQ:1"
                "audit.events.DLQ:1"
                "system.alerts:1"
              )

              for item in "${TOPICS[@]}"; do
                IFS=':' read -r topic partitions <<< "$item"
                kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
                  --topic "$topic" --partitions "$partitions" --replication-factor 1
              done

              echo "Kafka topics created successfully:"
              kafka-topics --bootstrap-server kafka:9092 --list
