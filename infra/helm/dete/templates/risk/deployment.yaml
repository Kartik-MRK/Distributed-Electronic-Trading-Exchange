apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk
  labels:
    {{- include "dete.labels" . | nindent 4 }}
    app: risk
spec:
  replicas: {{ .Values.risk.replicaCount }}
  selector:
    matchLabels:
      app: risk
  template:
    metadata:
      labels:
        app: risk
    spec:
      containers:
        - name: risk
          image: {{ .Values.risk.image }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: {{ .Values.risk.port }}
              name: http
            - containerPort: {{ .Values.risk.grpcPort }}
              name: grpc
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/dete?currentSchema=risk"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dete-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dete-secrets
                  key: POSTGRES_PASSWORD
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
          resources:
            {{- toYaml .Values.risk.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.risk.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.risk.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.risk.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: risk
  labels:
    {{- include "dete.labels" . | nindent 4 }}
    app: risk
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.risk.port }}
      targetPort: {{ .Values.risk.port }}
      name: http
    - port: {{ .Values.risk.grpcPort }}
      targetPort: {{ .Values.risk.grpcPort }}
      name: grpc
  selector:
    app: risk
