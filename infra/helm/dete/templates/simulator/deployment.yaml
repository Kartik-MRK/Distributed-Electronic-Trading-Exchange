apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
  labels:
    {{- include "dete.labels" . | nindent 4 }}
    app: simulator
spec:
  replicas: {{ .Values.simulator.replicaCount }}
  selector:
    matchLabels:
      app: simulator
  template:
    metadata:
      labels:
        app: simulator
    spec:
      containers:
        - name: simulator
          image: {{ .Values.simulator.image }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: {{ .Values.simulator.port }}
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: AUTH_SERVICE_URL
              value: "http://auth:8081"
            - name: ACCOUNT_SERVICE_URL
              value: "http://account:8082"
            - name: ORDER_SERVICE_URL
              value: "http://order:8083"
            - name: SIMULATOR_AUTH_URL
              value: "http://auth:8081"
            - name: SIMULATOR_ACCOUNT_URL
              value: "http://account:8082"
            - name: SIMULATOR_ORDER_URL
              value: "http://order:8083"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/dete?currentSchema=simulator"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dete-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dete-secrets
                  key: POSTGRES_PASSWORD
            - name: SECURITY_JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.jwtKeySecretName }}
                  key: public-key
          resources:
            {{- toYaml .Values.simulator.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.simulator.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.simulator.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.simulator.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: simulator
  labels:
    {{- include "dete.labels" . | nindent 4 }}
    app: simulator
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.simulator.port }}
      targetPort: {{ .Values.simulator.port }}
      name: http
  selector:
    app: simulator
