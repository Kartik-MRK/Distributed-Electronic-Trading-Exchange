apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit
  labels:
    {{- include "dete.labels" . | nindent 4 }}
    app: audit
spec:
  replicas: {{ .Values.audit.replicaCount }}
  selector:
    matchLabels:
      app: audit
  template:
    metadata:
      labels:
        app: audit
    spec:
      containers:
        - name: audit
          image: {{ .Values.audit.image }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: {{ .Values.audit.port }}
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: PORT
              value: {{ .Values.audit.port | quote }}
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/dete?currentSchema=audit"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dete-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dete-secrets
                  key: POSTGRES_PASSWORD
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
          resources:
            {{- toYaml .Values.audit.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.audit.port }}
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.audit.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: audit
  labels:
    {{- include "dete.labels" . | nindent 4 }}
    app: audit
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.audit.port }}
      targetPort: {{ .Values.audit.port }}
      name: http
  selector:
    app: audit
