monitoring:
  prometheus:
    enabled: true
    image: prom/prometheus:v2.54.1
    port: 9090
    resources:
      requests:
        cpu: 30m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 512Mi
  grafana:
    enabled: true
    image: grafana/grafana:11.2.0
    port: 3000
    resources:
      requests:
        cpu: 20m
        memory: 96Mi
      limits:
        cpu: 250m
        memory: 256Mi

ingress:
  enabled: true
  className: traefik
  annotations: {}
  host: ""
  tls: []
