# Default values for DETE Helm Chart
global:
  environment: local
  domain: localhost

images:
  pullPolicy: IfNotPresent
  registry: ""

secrets:
  postgresUser: dete
  postgresPassword: dete_local_secret
  postgresDb: dete
  redisPassword: dete_redis_secret
  jwtSecret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"

# Infrastructure Services
postgres:
  enabled: true
  image: postgres:16-alpine
  storageSize: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

redis:
  enabled: true
  image: redis:7-alpine
  storageSize: 1Gi
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

kafka:
  enabled: true
  image: confluentinc/cp-kafka:7.6.2
  zookeeperImage: confluentinc/cp-zookeeper:7.6.2
  storageSize: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 600m
      memory: 1280Mi

# Application Microservices
gateway:
  image: dete/gateway:latest
  replicaCount: 1
  port: 8080
  resources:
    requests:
      cpu: 30m
      memory: 192Mi
    limits:
      cpu: 400m
      memory: 384Mi

auth:
  image: dete/auth:latest
  replicaCount: 1
  port: 8081
  resources:
    requests:
      cpu: 25m
      memory: 192Mi
    limits:
      cpu: 300m
      memory: 384Mi

account:
  image: dete/account:latest
  replicaCount: 1
  port: 8082
  resources:
    requests:
      cpu: 30m
      memory: 192Mi
    limits:
      cpu: 400m
      memory: 512Mi

order:
  image: dete/order:latest
  replicaCount: 1
