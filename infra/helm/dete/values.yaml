  replicaCount: 1
  port: 8085
  grpcPort: 9095
  resources:
    requests:
      cpu: 25m
      memory: 192Mi
    limits:
      cpu: 300m
      memory: 384Mi

audit:
  image: dete/audit:latest
  replicaCount: 1
