
# ============================================================
# DETE — Local Development Infrastructure
# Start everything: docker compose up -d
# Stop everything:  docker compose down
# ============================================================

networks:
  dete-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  grafana-data:
  prometheus-data:

services:

  # ----------------------------------------------------------
  # PostgreSQL — authoritative store for all services
  # One shared instance, separate schemas per service
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: dete-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dete
      POSTGRES_PASSWORD: dete_local_secret
      POSTGRES_DB: dete
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - dete-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dete -d dete"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Redis — rate limiting, idempotency keys, ephemeral cache
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: dete-redis
    restart: unless-stopped
    command: redis-server --requirepass dete_redis_secret --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - dete-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dete_redis_secret", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Zookeeper — required by Kafka
  # ----------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.2
    container_name: dete-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "ruok,srvr,stat,conf"
    ports:
      - "2181:2181"
    networks:
      - dete-net
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep Mode"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Kafka — primary event backbone
  # ----------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.2
    container_name: dete-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - dete-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ----------------------------------------------------------
  # Kafka topic provisioning — creates all topics on startup
  # ----------------------------------------------------------
  kafka-init:
    image: confluentinc/cp-kafka:7.6.2
    container_name: dete-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Creating DETE Kafka topics..."

        # Main operational topics (3 partitions for instrument-level parallelism)
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic order.commands --partitions 3 --replication-factor 1

        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic order.events --partitions 3 --replication-factor 1

        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic trade.executions --partitions 3 --replication-factor 1

        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic market-data --partitions 3 --replication-factor 1

        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic ledger.events --partitions 3 --replication-factor 1

        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic audit.events --partitions 3 --replication-factor 1

        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic simulator.commands --partitions 1 --replication-factor 1

        # Dead-letter topics (single partition — sequential DLQ processing)
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic order.commands.DLQ --partitions 1 --replication-factor 1

        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic order.events.DLQ --partitions 1 --replication-factor 1

        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic trade.executions.DLQ --partitions 1 --replication-factor 1

        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic ledger.events.DLQ --partitions 1 --replication-factor 1

        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic audit.events.DLQ --partitions 1 --replication-factor 1

        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic system.alerts --partitions 1 --replication-factor 1

        echo "All DETE topics created successfully."
        kafka-topics --bootstrap-server kafka:29092 --list
    networks:
      - dete-net
    restart: "no"

  # ----------------------------------------------------------
  # Kafka UI — visual topic inspector for development
  # Access at http://localhost:8080
  # ----------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: dete-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: dete-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8080:8080"
    networks:
      - dete-net

  # ----------------------------------------------------------
  # Prometheus — scrapes metrics from all services
  # Access at http://localhost:9090
  # ----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: dete-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - dete-net

  # ----------------------------------------------------------
  # Grafana — dashboards for all metrics
  # Access at http://localhost:3000 (admin/admin)
  # ----------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: dete-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/system-overview.json
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - dete-net

  # ----------------------------------------------------------
  # Jaeger — distributed tracing UI
  # Access at http://localhost:16686
  # ----------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: dete-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC (services send traces here)
      - "4318:4318"     # OTLP HTTP
    networks:
      - dete-net
