# Gradle JVM arguments
# Use Java 21 for the Gradle daemon (system has Java 25 which Gradle 8.14 doesn't fully support)
# org.gradle.java.home=C\:\\Program Files\\Microsoft\\jdk-21.0.12.101-hotspot
org.gradle.jvmargs=-Xmx2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable Gradle daemon for faster subsequent builds
org.gradle.daemon=true

# Parallel execution disabled to prevent Docker Desktop port and container contention during multi-project test runs
org.gradle.parallel=false

# Enable configuration cache for faster builds
org.gradle.configuration-cache=false

# Enable build cache
org.gradle.caching=false

# Kotlin DSL
kotlin.code.style=official
