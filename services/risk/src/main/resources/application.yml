server:
  port: 8085

spring:
  application:
    name: risk-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: risk-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "com.dete.*"

risk:
  grpc:
    port: 9095
  rules:
    max-btc-qty: 10000000000         # 100 BTC (scaled: 100 * 10^8)
    max-eth-qty: 100000000000        # 1,000 ETH (scaled: 1,000 * 10^8)
    max-sol-qty: 1000000000000       # 10,000 SOL (scaled: 10,000 * 10^8)
    max-order-notional: 500000000000000 # $5,000,000 USD (scaled: 5,000,000 * 10^8)
    max-open-orders-per-account: 50
    max-price-deviation-pct: 0.10    # 10% deviation allowed from last trade price
    market-order-max-qty-ratio: 0.50 # Market order quantity cannot exceed 50% of instrument max

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
