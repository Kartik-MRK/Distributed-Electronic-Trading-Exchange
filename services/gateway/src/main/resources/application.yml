server:
  port: ${PORT:8080}

spring:
  application:
    name: gateway-service
  main:
    allow-bean-definition-overriding: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authService
                fallbackUri: forward:/fallback/auth-service
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/orders, /orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: orderService
                fallbackUri: forward:/fallback/order-service
        - id: account-service
          uri: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/accounts, /accounts/**
          filters:
            - name: CircuitBreaker
              args:
                name: accountService
                fallbackUri: forward:/fallback/account-service
        - id: market-data-service
          uri: ${MARKET_DATA_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/market-data, /market-data/**
          filters:
            - name: CircuitBreaker
              args:
                name: marketDataService
                fallbackUri: forward:/fallback/market-data-service
        - id: audit-service
          uri: ${AUDIT_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/admin/audit, /admin/audit/**
          filters:
            - name: CircuitBreaker
              args:
                name: auditService
                fallbackUri: forward:/fallback/audit-service
        - id: dlq-admin-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/admin/dlq/**
          filters:
            - name: CircuitBreaker
              args:
                name: orderService
                fallbackUri: forward:/fallback/order-service
        - id: market-data-ws
          uri: ${MARKET_DATA_WS_URL:ws://localhost:8087}
          predicates:
            - Path=/ws/**

resilience4j.circuitbreaker:
  instances:
    orderService:
      slidingWindowSize: 10
      failureRateThreshold: 50
      waitDurationInOpenState: 10s
      permittedNumberOfCallsInHalfOpenState: 3
    accountService:
      slidingWindowSize: 10
      failureRateThreshold: 50
      waitDurationInOpenState: 10s
      permittedNumberOfCallsInHalfOpenState: 3
    authService:
      slidingWindowSize: 10
      failureRateThreshold: 50
      waitDurationInOpenState: 10s
      permittedNumberOfCallsInHalfOpenState: 3
    marketDataService:
      slidingWindowSize: 10
      failureRateThreshold: 50
      waitDurationInOpenState: 10s
      permittedNumberOfCallsInHalfOpenState: 3
    auditService:
      slidingWindowSize: 10
      failureRateThreshold: 50
      waitDurationInOpenState: 10s
      permittedNumberOfCallsInHalfOpenState: 3

resilience4j.timelimiter:
  instances:
    orderService:
      timeoutDuration: 5s
    accountService:
      timeoutDuration: 5s
    authService:
      timeoutDuration: 5s
    marketDataService:
      timeoutDuration: 5s
    auditService:
      timeoutDuration: 5s

resilience4j.bulkhead:
  instances:
    orderService:
      maxConcurrentCalls: 50
      maxWaitDuration: 20ms
    accountService:
      maxConcurrentCalls: 50
      maxWaitDuration: 20ms
    authService:
      maxConcurrentCalls: 50
      maxWaitDuration: 20ms
    marketDataService:
      maxConcurrentCalls: 100
      maxWaitDuration: 20ms
    auditService:
      maxConcurrentCalls: 30
      maxWaitDuration: 20ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: gateway-service
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
