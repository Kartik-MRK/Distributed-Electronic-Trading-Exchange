server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dete}?currentSchema=auth
    username: ${DB_USER:dete}
    password: ${DB_PASSWORD:dete_local_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  flyway:
    enabled: true
    schemas: auth
    default-schema: auth
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:dete_redis_secret}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

auth:
  jwt:
    access-token-expiration-seconds: 900       # 15 minutes
    refresh-token-expiration-seconds: 604800   # 7 days
    key-id: "dete-auth-key-1"
  rate-limit:
    login-max-attempts: 5
    login-window-seconds: 60
  demo:
    enabled: true
    email: "demo@dete.io"
    username: "demo"
    password: "DemoPassword123!"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
